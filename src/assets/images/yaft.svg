<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="40" y1="60" x2="560" y2="60"/>
    <line x1="40" y1="120" x2="560" y2="120"/>
    <line x1="40" y1="180" x2="560" y2="180"/>
    <line x1="40" y1="240" x2="560" y2="240"/>
  </g>

  <!-- Header / Title -->
  <text x="50" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">YAFT Financial</text>
  <rect x="200" y="32" width="90" height="22" rx="11" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <text x="245" y="47" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Next.js 15</text>

  <!-- Metric Cards -->
  <rect x="50" y="70" width="150" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="65" y="90" fill="#94a3b8" font-family="system-ui" font-size="11">Net Worth</text>
  <text x="65" y="116" fill="#34d399" font-family="monospace" font-size="18" font-weight="700">+34.8% YoY</text>

  <rect x="220" y="70" width="150" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="235" y="90" fill="#94a3b8" font-family="system-ui" font-size="11">Active Ledgers</text>
  <text x="235" y="116" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="700">Multi-Account</text>

  <rect x="390" y="70" width="160" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="405" y="90" fill="#94a3b8" font-family="system-ui" font-size="11">API Documentation</text>
  <text x="405" y="116" fill="#fbbf24" font-family="monospace" font-size="18" font-weight="700">Swagger REST</text>

  <!-- Area Chart -->
  <path d="M 50 250 L 110 220 L 180 230 L 250 180 L 320 190 L 390 150 L 460 165 L 550 120 L 550 280 L 50 280 Z" fill="url(#chartGrad)"/>
  <path d="M 50 250 L 110 220 L 180 230 L 250 180 L 320 190 L 390 150 L 460 165 L 550 120" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chart Dots -->
  <circle cx="250" cy="180" r="4" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="390" cy="150" r="4" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="550" cy="120" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

  <!-- Footer Info -->
  <text x="50" y="315" fill="#64748b" font-family="monospace" font-size="11">Budgeting Engine • Cash Flow Analytics • Transaction Ingestion</text>
</svg>
