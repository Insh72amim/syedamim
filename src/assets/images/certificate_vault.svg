<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vaultBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background Rect with subtle border -->
  <rect width="400" height="240" rx="12" fill="url(#vaultBg)"/>
  <rect x="0.5" y="0.5" width="399" height="239" rx="11.5" stroke="#334155" stroke-opacity="0.6"/>
  
  <!-- Grid overlay -->
  <path d="M0 60 H400 M0 120 H400 M0 180 H400" stroke="#334155" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <path d="M100 0 V240 M200 0 V240 M300 0 V240" stroke="#334155" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  
  <!-- Certificate Document Graphic -->
  <g transform="translate(130, 30)">
    <!-- Document Backdrop Shadow -->
    <rect x="12" y="10" width="120" height="150" rx="8" fill="#090d16" opacity="0.6"/>
    
    <!-- Main Certificate Page -->
    <rect x="0" y="0" width="140" height="165" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="6" y="6" width="128" height="153" rx="5" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- Top Ribbon / Seal -->
    <circle cx="70" cy="42" r="18" fill="url(#goldGrad)"/>
    <path d="M63 56 L58 72 L70 66 L82 72 L77 56 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Star in Seal -->
    <path d="M70 34 L72.5 39.5 L78 40 L74 43.5 L75 49 L70 46 L65 49 L66 43.5 L62 40 L67.5 39.5 Z" fill="#78350f"/>
    
    <!-- Lines for certificate text -->
    <rect x="25" y="80" width="90" height="6" rx="3" fill="#94a3b8"/>
    <rect x="35" y="94" width="70" height="4" rx="2" fill="#64748b"/>
    <rect x="20" y="108" width="100" height="4" rx="2" fill="#475569"/>
    
    <!-- Signature Line & Badge -->
    <line x1="25" y1="135" x2="65" y2="135" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="105" cy="132" r="10" fill="url(#blueGrad)"/>
    <path d="M101 132 L104 135 L110 128" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Verified Badge Pill -->
  <g transform="translate(135, 205)">
    <rect width="130" height="24" rx="12" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.6"/>
    <circle cx="14" cy="12" r="4" fill="#10b981"/>
    <text x="26" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.05em">VERIFIED REPOSITORY</text>
  </g>
</svg>
