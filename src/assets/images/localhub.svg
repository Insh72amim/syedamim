<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#hubBg)"/>

  <!-- Title -->
  <text x="50" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">LocalHub Platform</text>
  <rect x="250" y="32" width="120" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="310" y="47" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">localhub.site</text>

  <!-- Service Hub Boxes -->
  <g transform="translate(50, 75)">
    <!-- Node 1: YAFT -->
    <rect x="0" y="0" width="155" height="85" rx="8" fill="#0f172a" stroke="rgba(6,182,212,0.4)" stroke-width="1"/>
    <text x="14" y="26" fill="#06b6d4" font-family="monospace" font-size="13" font-weight="700">YAFT</text>
    <text x="14" y="46" fill="#94a3b8" font-family="system-ui" font-size="10">Finance &amp; Ledger</text>
    <text x="14" y="68" fill="#34d399" font-family="monospace" font-size="11">● Active :3001</text>

    <!-- Node 2: PGHandle -->
    <rect x="175" y="0" width="155" height="85" rx="8" fill="#0f172a" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
    <text x="189" y="26" fill="#c084fc" font-family="monospace" font-size="13" font-weight="700">PGHandle</text>
    <text x="189" y="46" fill="#94a3b8" font-family="system-ui" font-size="10">Property Cloud</text>
    <text x="189" y="68" fill="#34d399" font-family="monospace" font-size="11">● Active :5174</text>

    <!-- Node 3: KnowledgeShelf -->
    <rect x="350" y="0" width="150" height="85" rx="8" fill="#0f172a" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="364" y="26" fill="#818cf8" font-family="monospace" font-size="13" font-weight="700">KnowledgeShelf</text>
    <text x="364" y="46" fill="#94a3b8" font-family="system-ui" font-size="10">Learning Engine</text>
    <text x="364" y="68" fill="#34d399" font-family="monospace" font-size="11">● Active :5180</text>

    <!-- Node 4: MinIO Storage -->
    <rect x="0" y="105" width="240" height="70" rx="8" fill="#0f172a" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
    <text x="14" y="130" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">MinIO S3 Storage</text>
    <text x="14" y="152" fill="#94a3b8" font-family="system-ui" font-size="11">Object Buckets &amp; Assets (:9001)</text>

    <!-- Node 5: Swagger API Gateway -->
    <rect x="260" y="105" width="240" height="70" rx="8" fill="#0f172a" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
    <text x="274" y="130" fill="#60a5fa" font-family="monospace" font-size="13" font-weight="700">API Gateway &amp; Docs</text>
    <text x="274" y="152" fill="#94a3b8" font-family="system-ui" font-size="11">OpenAPI / Swagger Routing</text>
  </g>

  <!-- Footer Info -->
  <text x="50" y="315" fill="#64748b" font-family="monospace" font-size="11">Microservice Router • Domain Proxy • Service Discovery Hub</text>
</svg>
